# Boot menu for the GRUB ISO produced by `make iso`.
#
# timeout=0 boots the first entry immediately; under `-display none` there is
# nothing to select anyway.  The kernel is loaded with the Multiboot2 protocol.
set timeout=0
set default=0

menuentry "PrincessIDE template kernel" {
    multiboot2 /boot/kernel.elf
    boot
}
