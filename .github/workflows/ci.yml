name: CI Gate

on:
  push:
    branches: [PrincessIDE]
  pull_request:
    branches: [PrincessIDE]

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            curl make gcc binutils python3 \
            grub-pc-bin grub-common xorriso mtools dpkg \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev \
            libxdo-dev libssl-dev pkg-config \
            build-essential file wget

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # Must be >= 22: jsdom@30 (used by the DOM tests through vitest)
          # depends on undici@8, which calls Node's internal
          # webidl.util.markAsUncloneable.  That API does not exist on Node 20,
          # so every jsdom test file dies at import time with
          # "TypeError: webidl.util.markAsUncloneable is not a function".
          # Node 24 is what the frontend suite is verified against locally.
          node-version: '24'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend dependencies
        run: pnpm -C apps/desktop install --frozen-lockfile || pnpm -C apps/desktop install

      - name: Run CI gate
        run: bash scripts/ci-gate.sh
