# Language module manifest for C (PrincessIDE M13)
#
# This file describes the C language support for PrincessIDE.
# It is part of the language module layer (M13) and serves as
# the reference implementation for the "one language = one manifest
# + one adapter set" architecture.
#
# Decisions referenced:
# - D4: C + assembly priority
# - D6: clangd-16 version
# - D7: clangd configuration constraints
# - D8: compile_commands.json generation strategy
# - D9: QEMU runtime backend
# - D17: LSP protocol stack delegation
# - D18: Language service version pinning

[language]
id = "c"
displayName = "C"
extensions = [".c", ".h", ".S"]
description = "C language support with kernel-specialised clangd configuration"

[language.lsp]
# D6/D18: clangd-16 is the language service, not plain clangd
# PRINCESSIDE_LANG_SERVICE_CLANGD env var can override this
command = "clangd-16"
args = ["--background-index", "--clang-tidy=false"]
# D7: The .clangd file is generated by princess-build, not by the language module
dot_clangd_strategy = "generate"
# D8: The compile_commands.json is generated by bear or the wrapper shim
compile_commands_strategy = "bear-or-shim"

[language.build]
# D4/D17: The build backend is 'make'
backend = "make"
# D8: compile_commands.json generation
cdb_generation = true
# D7: .clangd file generation
dot_clangd_generation = true
# D18: make clean before CDB generation
clean_before_cdb = true

[language.run]
# D9: QEMU multiboot2 runtime
backend = "qemu-multiboot2"
# D9: Serial output configuration
serial_args = ["-display", "none", "-serial", "stdio", "-monitor", "none"]
# D9: Triple fault detection
triple_fault_args = ["-d", "cpu_reset"]

[language.debug]
# D11: GDB DAP protocol
backend = "gdb-dap"
# TODO(P-F2): JDWP support will be added as a separate language module
