# Boot menu for the GRUB ISO produced by `make iso`.
#
# timeout=0 boots the first entry immediately; under `-display none` there is
# nothing to select.  The kernel is loaded with the Multiboot2 protocol (D2).
set timeout=0
set default=0

menuentry "PrincessIDE paging kernel" {
    multiboot2 /boot/pagingkernel.elf
    boot
}
