[package]
name = "princesside-desktop"
version = "0.1.0"
description = "PrincessIDE desktop shell — Tauri v2 window, IPC registration, child-process orchestration"
edition = "2021"
rust-version = "1.77"
license = "MIT"
publish = false

[lib]
name = "princesside_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The contract (§6.1) mandates tokio::process for child processes.  Only the
# features the shell needs are enabled.
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread"] }

# ---------------------------------------------------------------------------
# Engine crates — path dependencies into the root workspace's crates/.
#
# `apps/desktop/src-tauri` is a deliberately independent workspace (see below)
# so that Tauri's heavy dependency tree does not pollute the engine's
# `cargo test --workspace`.  The engine crates are brought in as path deps.
# ---------------------------------------------------------------------------
princess-core = { path = "../../../crates/princess-core" }
princess-build = { path = "../../../crates/princess-build" }
princess-run = { path = "../../../crates/princess-run" }
princess-symbol = { path = "../../../crates/princess-symbol" }
princess-debug = { path = "../../../crates/princess-debug" }
princess-bin = { path = "../../../crates/princess-bin" }
princess-ai = { path = "../../../crates/princess-ai" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
toml = "0.8"
sha2 = "0.10"

# ---------------------------------------------------------------------------
# Independent cargo workspace (deliberate).
#
# `apps/desktop/src-tauri` must NOT be a member of the root workspace owned by
# P2-A: two agents editing one [workspace] table would conflict, and the Tauri
# dependency tree is heavy enough that we do not want it in the engine's
# `cargo test --workspace` runs.  This empty table makes this manifest its own
# workspace root, so `cargo build` here never touches ../Cargo.toml.
# ---------------------------------------------------------------------------
[workspace]

[profile.dev]
# Tauri debug binaries are enormous; keep the shell buildable on a 4 GB / no-swap
# machine (D16 memory discipline).
debug = 1

[profile.release]
# Portable packaging (scripts/package-portable.sh) ships this binary, so strip it
# here instead of relying on the packager to remember: measured 13.80 MB
# unstripped -> 8.93 MB stripped.  LTO / opt-level="z" are deliberately NOT set —
# they cost minutes of build time and hundreds of MB of RSS for headroom we do
# not need against the 15 MB budget (D22 memory discipline).
strip = true
