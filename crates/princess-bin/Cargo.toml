[package]
name = "princess-bin"
description = "PrincessIDE binary inspection backend (P5): ELF sections/symbols/entry, address->source line, iced-x86 disassembly with side-by-side source, pread+LRU hex reader, CR3 page-table walk, GDT/IDT/TSS descriptor decoding and QEMU monitor/QMP parsing. Frozen stack per D20: object 0.40 + gimli 0.34 + addr2line 0.27 + iced-x86 1.21 (no goblin/elf/zydis)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
princess-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# D20 — frozen selection, do not re-litigate.  `object` reads the container,
# `gimli` decodes the raw `.debug_*` facts, `addr2line` answers "address ->
# file:line", `iced-x86` disassembles.  `default-features = false` on iced-x86 is
# mandatory (research D §1.3): the default set drags in the encoder / code_asm /
# block_encoder / op_code_info tables, which a read-only disassembler never uses.
# `names` is required, not cosmetic: `object` gates the typed flag constants
# (`elf::SectionFlags::SHF_WRITE`, ...) behind it.  Without the feature the only
# way to test a section flag is to compare against a raw integer, which is
# exactly the kind of hand-written bit math that silently drifts from
# `readelf`'s output.
object = { version = "0.40.0", default-features = false, features = [
    "read_core",
    "elf",
    "std",
    "compression",
    "names",
] }
# `endian-reader` is required, not optional: it is what provides
# `gimli::EndianRcSlice`, the owning reader `addr2line::Context` needs once the
# `object::File` it was built from has gone out of scope.  Without it the only
# reader is the borrowing `EndianSlice`, which would force the artifact bytes to
# live as long as the line table.
gimli = { version = "0.34.0", default-features = false, features = [
    "read",
    "std",
    "endian-reader",
] }
# `fallible-iterator` matters: without it the line-row iterator silently ends
# at the first decode error, so a corrupt/unusual CU would truncate the whole
# source map instead of reporting a problem.
addr2line = { version = "0.27.1", default-features = false, features = [
    "std",
    "loader",
    "fallible-iterator",
] }
fallible-iterator = "0.3"
iced-x86 = { version = "1.21.0", default-features = false, features = [
    "std",
    "decoder",
    "instr_info",
    "intel",
    "nasm",
    "gas",
    "fast_fmt",
] }
rustc-demangle = "0.1.28"
cpp_demangle = { version = "0.5.1", default-features = false, features = ["std"] }

# A capture file (the recorded monitor samples) is a normal file; `libc` gives
# the `pread(2)` behind `std::os::unix::fs::FileExt::read_at`, which is the
# access strategy the hex reader is required to use (research D §2, P5-3).
libc = { workspace = true }
